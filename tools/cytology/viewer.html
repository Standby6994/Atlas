<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visualizador de pacotes da citologia</title>
<style>html,body{margin:0;height:100%;background:#0e1927;color:#dfe8ef;font:13px system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#info{position:fixed;left:10px;top:8px;white-space:pre;pointer-events:none;text-shadow:0 1px 2px #000}</style>
<script type="importmap">{"imports":{"three":"../../vendor/build/three.module.js","three/addons/":"../../vendor/examples/jsm/"}}</script>
</head><body><div id="info">Carregando…</div><canvas id="c"></canvas>
<script type="module">
// Dev viewer: ?pack=<path from the project root>&id=<view id>. Parts come from data/cytology-content.json.
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createRealCytologyModel} from '../../cytology-real.js';
const q=new URLSearchParams(location.search),id=q.get('id'),pack=q.get('pack');
const content=await (await fetch('../../data/cytology-content.json')).json(),def=content.views.find(v=>v.id===id)||{id,parts:[]};
const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.001,50);const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(1,2,1.5);const fill=new THREE.DirectionalLight(0xbfd4ff,.8);fill.position.set(-1.5,-.5,-1);scene.add(sun,fill,new THREE.HemisphereLight(0xdde8ff,0x223344,1.1));
const t=performance.now(),model=await createRealCytologyModel(id,def,{url:new URL('../../'+pack,location.href)});scene.add(model.group);
const box=model.bounds,c=box.getCenter(new THREE.Vector3()),r=box.getSize(new THREE.Vector3()).length();
camera.position.copy(c).add(new THREE.Vector3(0,r*.9,r*1.2));const controls=new OrbitControls(camera,canvas);controls.target.copy(c);
document.getElementById('info').textContent=`${id} · ${pack}\n${model.stats.triangles.toLocaleString('pt-BR')} triângulos · ${model.stats.meshes} malhas · ${Math.round(performance.now()-t)} ms\n`+model.parts.map(p=>(p.geometryIdentified?'■ ':'□ ')+p.id).join('\n');
function frame(){const w=innerWidth,h=innerHeight;if(canvas.width!==Math.round(w*devicePixelRatio)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
window.view={scene,camera,controls,model,renderer};
</script></body></html>
